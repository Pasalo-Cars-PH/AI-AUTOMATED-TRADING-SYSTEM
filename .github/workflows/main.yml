name: Run Pytest Suite

on:
  push:
    branches:
      - "main"
      - "feat/risk-portfolio-engine-v4"
      - "feat/supabase-paper-ledger-v4"
  pull_request:
    branches:
      - "main"
      - "feat/risk-portfolio-engine-v4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_ledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest
        env:
          PYTHONPATH: .
          PAPER_LEDGER_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/paper_ledger_test
        run: pytest -v
