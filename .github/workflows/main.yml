name: Run Pytest Suite

on:
  push:
    branches:
      - "main"
      - "feat/risk-portfolio-engine-v4"
      - "feat/supabase-paper-ledger-v4"
  pull_request:
    branches:
      - "main"
      - "feat/risk-portfolio-engine-v4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: pytest -v
